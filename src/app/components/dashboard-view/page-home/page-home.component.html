<form [formGroup]="frm" (ngSubmit)="submit()">
    <section aria-labelledby="import-heading">
        <h2 id="import-heading" class="page-heading">Import SQL</h2>
        <mat-form-field appearance="outline" class="sql-field" [style.user-select]="'none'">
            <textarea
                matInput
                readonly
                rows="14"
                aria-label="SQL content"
                formControlName="detail"
            >{{ detail().payload }}</textarea>
            <mat-error *ngIf="startValidation && errorMessage">{{ errorMessage }}</mat-error>
        </mat-form-field>
        <input #txtFile type="file" hidden (change)="onFileSelected($event)"/>
        <div *ngIf="selectedFileName" class="selected-file">
            <mat-icon aria-hidden="true">description</mat-icon>
            <span>{{ selectedFileName }}</span>
        </div>
    </section>

    <div class="page-actions">
        <button type="button" mat-stroked-button (click)="txtFile.click()">
            <mat-icon>upload_file</mat-icon>
            Choose File
        </button>
        <button type="submit" mat-flat-button color="primary">
            <mat-icon>check</mat-icon>
            Submit
        </button>
    </div>
</form>

<progress-bar></progress-bar>
