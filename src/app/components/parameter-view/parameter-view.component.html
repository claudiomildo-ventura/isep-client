<form [formGroup]="frm" (ngSubmit)="submit()">
    <mat-card>
        <mat-card-content class="mat-elevation-z0">
            <div class="d-flex space-x-10 fields-row">

                <mat-form-field appearance="outline">
                    <mat-label [style.user-select]="'none'" #lblArchitecture>{{ architecture().payload }}</mat-label>
                    <mat-select formControlName="architectures">
                        <mat-option *ngFor="let item of architectures()" [value]="item.id">{{ item.data }}</mat-option>
                    </mat-select>
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label [style.user-select]="'none'" #lblDatabasePlatform>{{ databasePlatform().payload }}</mat-label>
                    <mat-select formControlName="databasePlatforms">
                        <mat-option *ngFor="let item of databasePlatforms()" [value]="item.id">{{ item.data }}</mat-option>
                    </mat-select>
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label [style.user-select]="'none'" #lblDatabaseEngineer>{{ databaseEngineer().payload }}</mat-label>
                    <mat-select formControlName="databaseEngineers">
                        <mat-option *ngFor="let item of databaseEngineers()" [value]="item.id">{{ item.data }}</mat-option>
                    </mat-select>
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label [style.user-select]="'none'" #lblEngineeringPlatform>{{ engineeringPlatform().payload }}</mat-label>
                    <mat-select formControlName="engineeringPlatforms">
                        <mat-option *ngFor="let item of engineeringPlatforms()" [value]="item.id">{{ item.data }}</mat-option>
                    </mat-select>
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label [style.user-select]="'none'" #lblTemplate>{{ template().payload }}</mat-label>
                    <mat-select formControlName="templates">
                        <mat-option *ngFor="let item of templates()" [value]="item.id">{{ item.data }}</mat-option>
                    </mat-select>
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label [style.user-select]="'none'" #lblProjectTemplate>{{ projectTemplate().payload }}</mat-label>
                    <mat-select formControlName="projectTemplates">
                        <mat-option *ngFor="let item of projectTemplates()" [value]="item.id">{{ item.data }}</mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
        </mat-card-content>
    </mat-card>

    <div class="d-flex flex-row justify-content-end mt-3">
        <button type="submit" mat-stroked-button color="accent" [disabled]="frm.invalid">
            <mat-icon>check</mat-icon>
            <span>Submit</span>
        </button>
    </div>
</form>

<progress-bar></progress-bar>
