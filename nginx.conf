# =============================================================================
# NGINX Configuration - isep_client
# =============================================================================
# Serves the Angular production build and proxies API calls to the orchestrator.
#
# Ports:
#   - isep_client      : 3000 (this server)
#   - isep_orchestrator: 3001 (proxy target)
#   - isep_microservice: 3002
# =============================================================================

server {
    # Angular app is served on port 3000
    listen 3000;
    server_name localhost;

    # Root directory where Angular build artifacts are stored
    root /usr/share/nginx/html;

    # -----------------------------------------------------------------
    # Reverse Proxy: API calls to the orchestrator
    # All requests to /orchestrator/v1/* are forwarded to isep_orchestrator
    # container on port 3001.
    #
    # Note: Host header uses hyphen (isep-orchestrator) instead of
    # underscore because Tomcat rejects underscores in domain names.
    # All required custom headers (Authorization, x-api-version, etc.)
    # are explicitly forwarded to pass the interceptor validation.
    # -----------------------------------------------------------------
    location /orchestrator/v1/ {
        proxy_pass http://isep-orchestrator:3001/orchestrator/v1/;
        proxy_set_header Host isep-orchestrator;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass_request_headers on;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header x-api-version $http_x_api_version;
        proxy_set_header x-request-id $http_x_request_id;
        proxy_set_header x-function-key $http_x_function_key;
    }

    # -----------------------------------------------------------------
    # Angular SPA routing
    # All other requests serve index.html so Angular Router handles
    # client-side navigation (e.g. /page-home, /page-structure).
    # -----------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Custom error pages for server-side errors
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}